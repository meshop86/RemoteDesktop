name: Smoke Windows

# Chạy thật file exe trên một máy Windows sạch. CI thường chỉ build và chạy
# test — mà "cài xong bấm vào không lên gì" là loại lỗi chỉ lộ ra khi có ai đó
# bấm vào thật.

# Bấm tay thôi: chạy kèm mỗi tag là thêm một runner Windows nữa cho mỗi bản
# phát hành, trong khi bản thân job Release đã kiểm file exe rồi.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-latest-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-latest-smoke-

      - name: Build
        run: cargo build --release -p rd-app

      - name: Chạy --help
        run: |
          $out = & .\target\release\remote-desktop.exe --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "--help thoát với mã $LASTEXITCODE" }
          if (-not $out.Contains("remote-desktop")) { throw "--help không in ra gì: $out" }
          $out

      - name: Mở giao diện 25 giây
        run: |
          $proc = Start-Process .\target\release\remote-desktop.exe -PassThru
          Start-Sleep -Seconds 25
          if ($proc.HasExited) {
            throw "giao diện chết sau khi mở, mã thoát $($proc.ExitCode)"
          }
          "tiến trình vẫn sống sau 25 giây"
          Stop-Process -Id $proc.Id -Force

      - name: Tự kiểm clipboard và mục tự khởi động
        run: |
          $out = & .\target\release\remote-desktop.exe --tu-kiem 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0) { throw "--tu-kiem thoát với mã $LASTEXITCODE" }

      - name: Clipboard đi từ máy chia sẻ sang máy điều khiển
        run: |
          # Hai tiến trình trên cùng một máy Windows: một chia sẻ, một điều
          # khiển. Cả hai ghi chung một file log nên đọc một chỗ là thấy cả
          # hai chiều.
          $log = "$env:LOCALAPPDATA\RemoteDesktop\rd.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $host_ = Start-Process .\target\release\remote-desktop.exe `
            -ArgumentList "--host","--password","ci-clip","--port","47901" -PassThru
          Start-Sleep -Seconds 8
          $viewer = Start-Process .\target\release\remote-desktop.exe `
            -ArgumentList "--connect","127.0.0.1:47901","--password","ci-clip" -PassThru
          Start-Sleep -Seconds 10
          Set-Clipboard -Value "RD-CI-CLIP-7731"
          Start-Sleep -Seconds 5
          Stop-Process -Id $viewer.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $host_.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $noi_dung = Get-Content $log -Raw
          $noi_dung
          if (-not $noi_dung.Contains("máy này vừa copy")) {
            throw "máy chia sẻ không thấy nội dung vừa copy"
          }
          if (-not $noi_dung.Contains("đã dán clipboard của máy kia")) {
            throw "máy điều khiển không dán được clipboard nhận về"
          }
          "clipboard đi hết vòng trên Windows thật"

      - name: Dấu card hỏng phải được xoá
        run: |
          $dau = "$env:LOCALAPPDATA\RemoteDesktop\card-loi.txt"
          if (Test-Path $dau) {
            throw "giao diện đã lên mà dấu card hỏng vẫn còn: $(Get-Content $dau)"
          }
          "không còn dấu nào"

      # Giả bộ lần chạy trước đã chết cùng đúng cái card duy nhất máy này có:
      # chương trình vẫn phải mở lên, vì thà thử lại còn hơn không có gì để vẽ.
      - name: Mở lại khi mọi card đều từng hỏng
        run: |
          $dau = "$env:LOCALAPPDATA\RemoteDesktop\card-loi.txt"
          Set-Content $dau "dx12|Microsoft Basic Render Driver"
          $proc = Start-Process .\target\release\remote-desktop.exe -PassThru
          Start-Sleep -Seconds 20
          if ($proc.HasExited) {
            throw "không mở lên khi có dấu card hỏng, mã thoát $($proc.ExitCode)"
          }
          "tiến trình vẫn sống sau 20 giây"
          Stop-Process -Id $proc.Id -Force

      # Đọc dù bước trên có đỏ hay không — chết ở đâu thì nhật ký nói ở đó.
      - name: Nhật ký
        if: always()
        run: |
          $log = "$env:LOCALAPPDATA\RemoteDesktop\rd.log"
          if (Test-Path $log) { Get-Content $log } else { "không có file nhật ký tại $log" }
