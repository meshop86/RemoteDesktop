name: CI

# Chỉ chạy khi bấm tay. Quota Actions của dự án này đã cạn, mà runner macOS
# tính giá gấp 10 lần runner Linux — mỗi lần đẩy code lên là mất vài chục phút
# hạn mức. Kiểm tra tương đương chạy được ngay trên máy:
#
#     cargo clippy --workspace --all-targets -- -D warnings
#     cargo test --workspace
#     cargo check --workspace --target x86_64-pc-windows-msvc   # nhánh Windows
#
# Lệnh thứ ba cần `cargo xwin` cho những crate có mã C (ring); riêng rd-codec,
# rd-capture, rd-input thì `cargo check --target` thường là đủ.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    # Hai hệ điều hành chạy hai nhánh code hoàn toàn khác nhau (ScreenCaptureKit
    # + VideoToolbox so với Desktop Duplication + Media Foundation), nên kiểm
    # một bên không nói gì về bên kia. Cả hai đều phải xanh.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cài Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
